[package]
name = "racc-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "advanced", "tokio", "lazy", "canvas"] }
racc-core = { path = "../core" }
racc-clipboard = { path = "../clipboard" }
racc-input = { path = "../input" }
racc-decode = { path = "../decode" }
racc-proto = { path = "../proto" }
racc-session = { path = "../session" }
racc-telemetry = { path = "../telemetry" }
racc-testkit = { path = "../testkit" }
racc-topology = { path = "../topology" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "=0.24.2", default-features = false }
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
racc-capture = { path = "../capture" }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSScreen"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry", "NSThread"] }
