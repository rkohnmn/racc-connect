[package]
name = "racc-host-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
racc-capture = { path = "../capture" }
racc-clipboard = { path = "../clipboard" }
racc-core = { path = "../core" }
racc-identity = { path = "../identity" }
racc-input = { path = "../input" }
racc-encode = { path = "../encode" }
racc-net = { path = "../net" }
racc-proto = { path = "../proto" }
racc-session = { path = "../session" }
racc-topology = { path = "../topology" }

[dev-dependencies]
racc-net = { path = "../net", features = ["test-bind"] }

[target.'cfg(windows)'.dependencies]
windows = { version = '0.58.0', features = ['Win32_Foundation', 'Win32_Security', 'Win32_Security_Authorization', 'Win32_Security_Cryptography', 'Win32_System_Diagnostics_Debug', 'Win32_System_Environment', 'Win32_System_RemoteDesktop', 'Win32_System_Services', 'Win32_System_Pipes', 'Win32_System_IO', 'Win32_Storage_FileSystem', 'Win32_System_Threading', 'Win32_UI_WindowsAndMessaging'] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
