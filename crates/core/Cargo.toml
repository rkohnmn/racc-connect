[package]
name = "racc-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
loopback-test = ["racc-net/test-bind"]

[dependencies]
racc-proto = { path = "../proto" }
racc-topology = { path = "../topology" }
racc-telemetry = { path = "../telemetry" }
racc-session = { path = "../session" }
racc-decode = { path = "../decode" }
racc-net = { path = "../net" }
racc-identity = { path = "../identity" }
racc-clipboard = { path = "../clipboard" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
racc-net = { path = "../net", features = ["test-bind"] }
